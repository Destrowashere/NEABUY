    <script>
      function redirectToInstagram() {
          window.open("https://www.instagram.com/near_buy_/", "_blank");
      }
      function redirectToFacebook() {
          window.open("https://www.facebook.com/profile.php?id=61550718872290", "_blank");

                document.getElementById('add-product-btn').addEventListener('click', function() {
                    document.getElementById('product-form').style.display = 'block';
                });
        
                document.getElementById('submit-product').addEventListener('click', function(event) {
                    event.preventDefault();
                    const name = document.getElementById('product-name').value;
                    const description = document.getElementById('product-description').value;
                    const quantity = document.getElementById('product-quantity').value;
                    const price = document.getElementById('product-price').value;
                    const imageFile = document.getElementById('product-image').files[0];
        
                    if (name && description && quantity && price && imageFile) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const imageUrl = e.target.result;
                            const product = {
                                name,
                                description,
                                quantity,
                                price,
                                imageUrl
                            };
                            addProductToPage(product);
                            saveProduct(product);
                            resetForm();
                            document.getElementById('product-form').style.display = 'none';
                        };
                        reader.readAsDataURL(imageFile);
                    } else {
                        alert('Por favor, rellene todos los campos.');
                    }
                });
        
                function addProductToPage(product, index) {
                    const productList = document.getElementById('product-list');
                    const productDiv = document.createElement('div');
                    productDiv.classList.add('product');
                    productDiv.setAttribute('data-index', index);
                    productDiv.innerHTML = `
                        <img src="${product.imageUrl}" alt="${product.name}">
                        <div class="product-details">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p>Cantidad: ${product.quantity}</p>
                            <p>Precio: €${product.price}</p>
                        </div>
                        <button class="delete-btn">Borrar</button>
                    `;
                    productDiv.querySelector('.delete-btn').addEventListener('click', function() {
                        deleteProduct(index);
                    });
                    productList.appendChild(productDiv);
                }
        
                function saveProduct(product) {
                    const products = JSON.parse(localStorage.getItem('products')) || [];
                    products.push(product);
                    localStorage.setItem('products', JSON.stringify(products));
                }
        
                function loadProducts() {
                    const products = JSON.parse(localStorage.getItem('products')) || [];
                    products.forEach((product, index) => addProductToPage(product, index));
                }
        
                function deleteProduct(index) {
                    let products = JSON.parse(localStorage.getItem('products')) || [];
                    products.splice(index, 1);
                    localStorage.setItem('products', JSON.stringify(products));
                    document.getElementById('product-list').innerHTML = '';
                    loadProducts();
                }
        
                function resetForm() {
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-description').value = '';
                    document.getElementById('product-quantity').value = '';
                    document.getElementById('product-price').value = '';
                    document.getElementById('product-image').value = '';
                }
        
                window.onload = function() {
                    loadProducts();
                }

                document.getElementById('submit-product').addEventListener('click', function(event) {
    event.preventDefault();
    const name = document.getElementById('product-name').value;
    const description = document.getElementById('product-description').value;
    const quantity = document.getElementById('product-quantity').value;
    const price = document.getElementById('product-price').value;
    const imageFile = document.getElementById('product-image').files[0];

    if (name && description && quantity && price && imageFile) {
        const formData = new FormData();
        formData.append('nombre', name);
        formData.append('descripcion', description);
        formData.append('cantidad', quantity);
        formData.append('precio', price);
        formData.append('imagen', imageFile);

        fetch('guardar_producto.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Producto guardado correctamente.');
            } else {
                alert('Error al guardar el producto: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error al guardar el producto.');
        });
    } else {
        alert('Por favor, rellene todos los campos.');
    }
});
